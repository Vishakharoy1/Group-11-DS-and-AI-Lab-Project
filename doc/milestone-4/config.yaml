# ─────────────────────────────────────────────
# MobileNetV3-Large Hyperparameter Optimization Config
# ─────────────────────────────────────────────

# Paths
data_dir: "dataset"          # relative to rohit/ workspace root
checkpoint_dir: "mobilenetv3large/checkpoints"
log_dir: "mobilenetv3large/logs"
output_dir: "mobilenetv3large/outputs"

# Data & Hardware
image_size: 224
num_workers: 8           # M4 Pro unified memory performance tuning
pin_memory: false        # false for Apple Silicon MPS
seed: 42

# Model Architecture
model_name: "mobilenetv3_large_100"   # timm model ID
num_classes: 2
pretrained: true

# Base Hyperparameters (Baseline Control Run)
learning_rate: 0.001
batch_size: 64
weight_decay: 0.01
dropout: 0.2
optimizer: "adamw"         # "adam" or "adamw"
scheduler: "cosine"        # "cosine" or "plateau"
label_smoothing: 0.0
epochs: 5

# Augmentation Settings
augmentation:
  horizontal_flip: true
  brightness: 0.2
  contrast: 0.2
  jpeg_quality_min: 75
  jpeg_quality_max: 100
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std:  [0.229, 0.224, 0.225]
